<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
    </head>
        <header>
            <h1>Proyecto 2</h1>
        </header>
        <div class="div_main">
            <p>Esta es una practica completa de JavaScript y CSS, 
                donde se aplican los conocimientos aquiridos 
                en el curso de desarrollo web. A continuacion se presentan diferentes secciones que muestran el uso de 
                estilos CSS y funcionalidades de JavaScript.
            </p>
            <button class="btn" id="btn_modo">Cambiar estilo</button>
        </div>
        <div class="div_flex">
            <div class="div_flexhijo amarillo">
                <img src=".img/imagen1.jpg" alt="Imagen 1">
            </div>
            <div class="div_flexhijo verde">
                <img src=".img/imagen2.jpg" alt="Imagen 2">
            </div>
            <div class="div_flexhijo azul">
                <img src=".img/imagen3.jpg" alt="Imagen 3">
            </div>
        <div class="Formulario">
            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
                <br>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="Ingrese su correo electronico">
                <br>
                <label for="mensaje">Contraseña:</label>
                <input type="password" id="mensaje" name="pass" required placeholder="Ingrese su contraseña">
                <br>
                <label for="cel">Numero de telefono:</label>
                <input type="tel" id="cel" name="cel" required placeholder="Ingrese su numero de telefono">
                <br>
                <label for ="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Ingrese su mensaje"></textarea>
                <br>
                <input type="submit" value="Enviar">
                <div class="respuesta" id="respuesta"></div>
                </form> 
             </div>  
             <div class="div_flexhijo morado">
                <img src=".img/imagen1.jpg" alt="Imagen 1">
            </div>
            <div class="div_flexhijo naranja">
                <img src=".img/imagen2.jpg" alt="Imagen 2">
            </div>
            <div class="div_flexhijo rojo">
                <img src=".img/imagen3.jpg" alt="Imagen 3">
            </div>
        </div>
    </body>
</html>
