<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Shop | Inicio</title>

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar py-3" aria-label="Menú principal">
      <div class="container">
        <a class="navbar-brand fs-3" href="index.html">CORE SHOP</a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav text-center py-3">
            <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="sudaderas.html">Sudaderas</a></li>
            <li class="nav-item"><a class="nav-link" href="gorras.html">Gorras</a></li>
            <li class="nav-item"><a class="nav-link" href="crocs.html">Crocs</a></li>
            <li class="nav-item"><a class="nav-link" href="playeras.html">Playeras</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <section class="text-center mb-5" data-aos="fade-up">
      <h1 class="display-5">Core Shop</h1>
      <p class="text-secondary mb-0">Sudaderas, gorras, crocs y playeras.</p>
    </section>

    <section>
      <h2 class="visually-hidden">Categorías</h2>
      <div class="row g-3">
        <div class="col-6 col-lg-3" data-aos="fade-up">
          <a href="sudaderas.html" class="categoria">
            <img src="img/sudaderas.webp" alt="Sudaderas">
            <span>Sudaderas</span>
          </a>
        </div>
        <div class="col-6 col-lg-3" data-aos="fade-up">
          <a href="gorras.html" class="categoria">
            <img src="img/gorras.webp" alt="Gorras">
            <span>Gorras</span>
          </a>
        </div>
        <div class="col-6 col-lg-3" data-aos="fade-up">
          <a href="crocs.html" class="categoria">
            <img src="img/crocs.jpeg" alt="Crocs">
            <span>Crocs</span>
          </a>
        </div>
        <div class="col-6 col-lg-3" data-aos="fade-up">
          <a href="playeras.html" class="categoria">
            <img src="img/playeras.webp" alt="Playeras">
            <span>Playeras</span>
          </a>
        </div>
      </div>
    </section>

    <section id="contacto" class="row justify-content-center mt-5 pt-4">
      <div class="col-12 col-lg-8">
        <h2 class="text-center">Contacto</h2>
        <p class="text-secondary text-center mb-4">¿Tienes una duda o buscas algo en especial? Escríbenos.</p>
        <form id="form-contacto" class="formulario p-4" novalidate>
          <div id="mensaje" class="mensaje p-3 mb-3 d-none"></div>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input type="text" id="nombre" class="form-control" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="correo" class="form-label">Correo</label>
              <input type="email" id="correo" class="form-control" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="tel" id="telefono" class="form-control" maxlength="10" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="asunto" class="form-label">Asunto</label>
              <select id="asunto" class="form-select" required>
                <option value="">Selecciona…</option>
                <option>Duda sobre un producto</option>
                <option>Pedido especial</option>
                <option>Tallas</option>
                <option>Otro</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12">
              <label for="comentario" class="form-label">Mensaje</label>
              <textarea id="comentario" class="form-control" rows="4" required></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-rv w-100 py-2">Enviar</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0 fs-5"><i class="fa-solid fa-store me-2"></i>Core Shop</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="app.js"></script>
</body>
</html>
